name: Release

# Releases the version in startos/versions/current.ts (3.31.0:4 -> tag
# v3.31.0_4): builds x86_64 and aarch64 .s9pk files, signs them with the
# DEV_KEY secret, and attaches them to a GitHub Release. Nothing is published
# to a StartOS registry.
#
# Runs when:
# - a pull request that changes current.ts is merged to main and that
#   version has no tag yet: the tag is created here, so no manual step;
# - someone pushes a v* tag by hand: the tag must match current.ts;
# - someone runs it from the Actions tab (Run workflow, on main): it releases
#   main's version, tagging it if needed. If the tag exists but has no GitHub
#   Release (an earlier release failed), it releases that tag again. If that
#   version is already released, it raises the package revision
#   (3.31.0:15 -> 3.31.0:16, via .github/scripts/bump-mealie.mjs --revision),
#   commits that to main and releases it.

on:
  push:
    branches: ['main']
    paths: ['startos/versions/current.ts']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (only used when a new revision is needed because this version is already released)'
        type: string
        default: ''

permissions: {}

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag || steps.bump.outputs.tag }}
      release: ${{ steps.decide.outputs.release || (steps.bump.outputs.tag && 'true') }}
    steps:
      - uses: actions/checkout@v6
      - name: Read the package version
        id: version
        uses: Start9Labs/start-technologies/.github/actions/extract-version@master
      - name: Decide what to release
        id: decide
        env:
          EXPECTED: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.DEV_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::The DEV_KEY repository secret is not set. See 'Releasing' in README.md."
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "$EXPECTED" ]; then
              echo "::error::Tag $REF_NAME does not match package version $VERSION. Tag the release $EXPECTED instead."
              exit 1
            fi
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REF_NAME" != main ]; then
            echo "::error::Run this workflow on main. To release from another branch, merge it first."
            exit 1
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$EXPECTED" > /dev/null; then
              if [ "$EVENT" = workflow_dispatch ] && ! gh release view "$EXPECTED" > /dev/null 2>&1; then
                echo "Tag $EXPECTED exists but has no release; releasing it again."
                echo "tag=$EXPECTED" >> "$GITHUB_OUTPUT"
                echo "release=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$EVENT" = workflow_dispatch ]; then
                echo "$EXPECTED is already released; bumping the package revision."
                echo "bump=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Tag $EXPECTED already exists; nothing new to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A tag pushed with the workflow token doesn't start this workflow
            # again, so the release job below is the only run.
            git tag "$EXPECTED"
            git push origin "refs/tags/$EXPECTED"
          fi
          echo "tag=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.bump == 'true'
        with:
          node-version: 22

      - name: Bump the package revision, commit to main and tag it
        id: bump
        if: steps.decide.outputs.bump == 'true'
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$NOTES" ]; then
            MEALIE=$(grep -oP "ghcr\.io/mealie-recipes/mealie:\Kv[^'\"]+" startos/manifest/index.ts)
            NOTES="Rebuild of the package for Mealie $MEALIE, with the latest packaging changes."
          fi
          npm ci
          node .github/scripts/bump-mealie.mjs --revision "$NOTES"
          npx tsc --noEmit
          VERSION=$(grep -oP "version:\s*'\K[^']+" startos/versions/current.ts)
          TAG="v${VERSION//:/_}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git add -A startos
          git commit -m "Release $VERSION"
          git tag "$TAG"
          # Pushes made with the workflow token don't start other workflows,
          # so this run's release job is the only release. --atomic: if main
          # moved since this run started, neither main nor the tag changes.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: write
    uses: Start9Labs/start-technologies/.github/workflows/release.yml@master
    with:
      TAG: ${{ needs.prepare.outputs.tag }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
